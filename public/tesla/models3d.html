<meta charset="utf-8">

<title>বাংলা টেসলা — ৩ডি মডেল গ্যালারি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1b1033; color: #fff7e8; font-family: 'Hind Siliguri', 'Nirmala UI', sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  header { position: fixed; left: 12px; top: 8px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { margin: 0 8px 0 0; font: 400 28px 'Galada', 'Nirmala UI', sans-serif; color: #ffd23f; -webkit-text-stroke: 1px #1d1428; text-shadow: 2px 2px 0 #ff4fa3; }
  button, a.btn { font: 700 14px 'Hind Siliguri', 'Nirmala UI', sans-serif; border: 2px solid #1d1428; border-radius: 99px; background: #ffd23f; color: #1d1428; padding: 2px 12px; cursor: pointer; text-decoration: none; box-shadow: 2px 2px 0 #1d1428; }
  button.on { background: #35d07f; }
  a.btn { background: #ff4fa3; color: #fff7e8; }
  .note { position: fixed; left: 12px; bottom: 10px; font-size: 14px; color: #cbbbe8; background: rgba(29, 20, 40, 0.7); border-radius: 99px; padding: 2px 12px; }
</style>

<body>
<canvas id="c"></canvas>
<header>
  <h1>৩ডি মডেল</h1>
  <span id="views"></span>
  <span id="poses"></span>
  <a class="btn" href="index.html">▶ খেলুন</a>
</header>
<div class="note">টেনে ঘোরান, স্ক্রল করে কাছে-দূরে</div>
<script src="src/vendor/three.min.js?v=149"></script>
<script src="src/art.js?v=4"></script>
<script src="src/3d/kit.js?v=4"></script>
<script src="src/3d/textures.js?v=5"></script>
<script src="src/3d/models.js?v=4"></script>
<script>
/* A turntable of every 3D model in the game, with the rider's poses. */
(function () {
  const T = THREE, M = BT.models3, A = BT.art;
  const canvas = document.getElementById('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  BT.k3.setAniso(renderer.capabilities.getMaxAnisotropy());
  const scene = new T.Scene();
  scene.background = new T.Color('#cfe3ee');
  scene.fog = new T.Fog('#cfe3ee', 30, 80);
  scene.add(new T.HemisphereLight('#eef6ff', '#a08f74', 0.58));
  const sun = new T.DirectionalLight('#fff1d6', 0.62);
  sun.position.set(-4, 10, 6);
  scene.add(sun);
  const ground = new T.Mesh(new T.PlaneGeometry(80, 80), new T.MeshLambertMaterial({ color: '#6b6e75' }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const camera = new T.PerspectiveCamera(40, 1, 0.1, 200);
  const items = [];
  const place = (m, x, z, ry = 0, y = 0) => {
    m.group.position.set(x, y, z);
    m.group.rotation.y = ry;
    scene.add(m.group);
    items.push(m);
    return m;
  };
  const hero = place(M.makeRickshaw(A.SKINS.tesla), 0, 0);
  place(M.makeRickshaw(A.SKINS.peacock), 0, -3.2);
  place(M.makeRickshaw(A.SKINS.redfairy), 0, 3.2);
  place(M.makeRickshaw(A.SKINS.golden), -4.5, 3.2);
  ['sky', 'gold', 'queen'].forEach((k, i) => place(M.makeRickshaw(A.SKINS[k]), -4.5, -i * 3.2));
  place(M.makeCar('#f2f4f7', 0), 7, 0);
  place(M.makeCar('#7a1f2b', 1), 7, -3.4);
  place(M.makeCar('#2b2f36', 2), 7, 3.4);
  place(M.makeBus('#d62839'), 15, 0);
  place(M.makeBus('#2a9d4b'), 15, 4);
  place(M.makeCNG(), 7, 6.8);
  Object.keys(M.PEOPLE).forEach((t, i) => place(M.makePerson(t), -3 + i * 1.3, -10, 0.3));
  ['coin', 'battery', 'boost', 'tea'].forEach((k, i) => place(M.makePickup(k), -10, -1.5 + i * 0.9, 0, 0.5));
  place(M.makeBarricade(), -12.5, 0);

  let pose = null, pedal = false, yaw = 0.7, pitch = 0.25, dist = 9;
  const target = new T.Vector3(0, 1, 0);
  const VIEWS = [
    ['রিকশা', [0.3, 1.2, 0], 1.0, 0.18, 5.5],
    ['পেছন থেকে', [0, 1.1, 0], -Math.PI / 2 - 0.3, 0.25, 6],
    ['স্কিন', [-4.5, 1.1, -1.6], -2.1, 0.3, 12],
    ['গাড়ি', [7, 0.8, 1.5], 0.9, 0.22, 11],
    ['বাস', [15, 1.5, 2], -0.8, 0.15, 13],
    ['মানুষ', [0, 1.0, -10], 0.9, 0.12, 7],
    ['জিনিসপত্র', [-11, 0.6, 0], 1.2, 0.3, 5],
  ];
  const POSES = [['স্বাভাবিক', null], ['ক্ষমা চাওয়া', 'sorry'], ['মাথা চুলকানো', 'scratch'], ['জয়!', 'win']];
  const btn = (box, label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => fn(b);
    document.getElementById(box).appendChild(b);
    return b;
  };
  for (const [label, t, y, p, d] of VIEWS) btn('views', label, () => { target.set(...t); yaw = y; pitch = p; dist = d; });
  for (const [label, p] of POSES) btn('poses', label, () => (pose = p));
  btn('poses', 'প্যাডেল', (b) => b.classList.toggle('on', (pedal = !pedal)));

  let drag = null;
  canvas.onpointerdown = (e) => (drag = [e.clientX, e.clientY]);
  window.onpointerup = () => (drag = null);
  window.onpointermove = (e) => {
    if (!drag) return;
    yaw -= (e.clientX - drag[0]) * 0.008;
    pitch = Math.max(-0.05, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY];
  };
  canvas.onwheel = (e) => (dist = Math.max(2, Math.min(45, dist * (e.deltaY > 0 ? 1.1 : 0.9))));
  const t0 = performance.now();
  function frame() {
    const t = (performance.now() - t0) / 1000;
    const w = innerWidth, h = innerHeight;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio())) renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(target);
    for (const m of items) {
      if (m.skin) m.pose({ t, wheel: t * 4, crank: t * 4 * 0.55, pedal: pedal || !m.skin.battery, pose: m === hero ? pose : null, talk: m === hero && !!pose, sway: 0.6 });
      else if (m.type) m.pose({ t, walk: t * 8, speed: 1, angry: pose === 'sorry' });
      else if (m.pose) m.pose({ t, wheel: t * 3 });
      if (m.kind) m.group.rotation.y = t * 2;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
