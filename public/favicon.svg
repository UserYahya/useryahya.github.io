<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Ink Canvas -->
  <rect width="100" height="100" rx="20" fill="#1B2A4A"/>
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="88" height="88" rx="14" stroke="#D9A441" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Bengali Letter 'ই' (Bangla 'I') -->
  <!-- Top Banner / উড়নি (Flying tail) -->
  <path
    d="M48 26 C52 14, 66 12, 74 19 C78 23, 76 27, 72 26"
    stroke="#D9A441"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top Matra (মাত্রা / Roof Line) -->
  <path
    d="M22 28 L78 28"
    stroke="#D9A441"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Body of Bangla 'ই' -->
  <path
    d="M32 28 C26 34, 26 44, 34 46 C42 48, 56 42, 60 52 C64 62, 54 74, 42 74 C34 74, 30 68, 32 62 C34 56, 42 56, 42 62"
    stroke="#FAF8F3"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Decorative Maroon Accent Stamp Dot -->
  <circle cx="74" cy="72" r="3.5" fill="#FE95A2"/>
</svg>
